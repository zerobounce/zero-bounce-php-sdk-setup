name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.1.1)
        required: true

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Verify tag and composer version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(php -r 'echo json_decode(file_get_contents("composer.json"))->version;')
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: composer.json version ($PKG_VERSION) does not match tag ($TAG)."
            exit 1
          fi
          echo "Publishing tag: $TAG (zero-bounce/sdk@$PKG_VERSION)"

  test:
    name: Test
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

  release:
    name: Create GitHub Release
    needs: [test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

  update-packagist:
    name: Update Packagist
    needs: [release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      # Same shape as Packagist’s manual update curl:
      # curl -XPOST -H'content-type:application/json' \
      #   'https://packagist.org/api/update-package?username=zerobounce&apiToken=…' \
      #   -d'{"repository":{"url":"…"}}'
      # Package page URL avoids 404 when github.repository ≠ Packagist’s stored VCS URL.
      - name: Trigger Packagist update
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_API_TOKEN:-}" ]; then
            echo "Error: PACKAGIST_API_TOKEN secret is not set."
            exit 1
          fi
          API_TOKEN_ENC=$(jq -nr --arg t "$PACKAGIST_API_TOKEN" '$t|@uri')
          BODY=$(jq -n --arg url 'https://packagist.org/packages/zero-bounce/sdk' '{"repository":{"url":$url}}')
          curl -fsSL -X POST \
            -H 'content-type: application/json' \
            -H 'User-Agent: ZeroBounce-PHP-SDK-Publish-Workflow (mailto:integrations@zerobounce.net)' \
            --data-binary "$BODY" \
            "https://packagist.org/api/update-package?username=zerobounce&apiToken=${API_TOKEN_ENC}"
